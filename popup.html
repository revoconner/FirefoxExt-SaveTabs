<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <button id="save-new" title="Save open tabs into a new folder">Add All Tabs</button>
    <div id="folder-list"></div>
    <div id="empty-note" hidden>No saved folders yet. Hit the button above.</div>
    <div id="settings">
        <label><input type="checkbox" id="opt-all-windows"> Save tabs from all open windows</label>
        <label><input type="checkbox" id="opt-replace"> Folder save replaces its tabs instead of adding</label>
        <label><input type="checkbox" id="opt-hide-titles"> Hide page titles in link rows</label>
        <div id="settings-buttons">
            <button id="export-all">Export all (JSON)</button>
            <button id="import-json">Import JSON</button>
        </div>
    </div>
    <div id="toast" hidden></div>
    <script src="popup.js"></script>
</body>
</html>
